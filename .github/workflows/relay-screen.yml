name: Daily relay screen

on:
  schedule:
    - cron: "45 10 * * 1-5" # 18:45 Beijing, after the CN close
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-screen
  cancel-in-progress: false

jobs:
  pack:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/data-pack.yml
    with:
      mode: update
      days: "250"
      source: daily
    secrets:
      TICKPLUS_API_KEY: ${{ secrets.TICKPLUS_API_KEY }}

  screen:
    needs: pack
    if: ${{ needs.pack.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPHASIFT_DATA_DIR: ${{ github.workspace }}/data
      ALPHASIFT_PACK_DIR: ${{ github.workspace }}/pack
      ALPHASIFT_INDUSTRY_PROVIDER_CACHE_DIR: ${{ github.workspace }}/state/industry_provider_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: pack
          key: cn-daily-pack-${{ github.run_id }}
          restore-keys: cn-daily-pack-
      - name: Verify the local daily pack
        run: alphasift pack info > /dev/null
      - name: Run rule-based relay screen
        run: alphasift screen relay_1to2_2to3 --no-llm --no-post-analysis --output data/relay/screen-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-candidates-${{ github.run_id }}
          path: data/relay/
          if-no-files-found: error
          retention-days: 7
